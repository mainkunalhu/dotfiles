"$schema" = "https://starship.rs/config-schema.json"

# Powerline look (user@host block + time, $ below), posterpole colors.
# NOTE: top-level keys (palette, format) must stay above all [tables] — TOML
# assigns anything after a [header] to that table.
palette = "posterpole"
format = """$username$hostname$git_branch$git_status$cmd_duration$time$line_break$character"""

# Posterpole palette (matches ghostty/themes/posterpole-default):
# named styles below resolve through this.
[palettes.posterpole]
black = "#2c2c30"
red = "#a97070"
green = "#778c73"
yellow = "#cc9166"
blue = "#6c7f93"
purple = "#b894af"
cyan = "#8ea4a2"
white = "#afa79d"

[username]
show_always = true
style_user = "black bold bg:green"
style_root = "black bold bg:red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "black bold bg:green"
format = "[@$hostname]($style)[ ](bold green) "

[git_branch]
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 2000
style = "bold yellow"
format = "took [$duration]($style) "

[time]
disabled = false
time_format = "%T"
style = "bold green"
format = "| [$time]($style) "

[character]
success_symbol = "[\\$](bold white)"
error_symbol = "[\\$](bold red)"
